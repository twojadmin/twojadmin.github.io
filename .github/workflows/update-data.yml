name: Aktualizacja danych symulatora

# Co tydzień (oraz ręcznie) pobiera daty wsparcia z endoflife.date i katalog CISA KEV,
# aktualizuje data/lifecycle.json i data/vulnerabilities.json i otwiera pull request ze zmianami.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aktualizacja plików danych
        run: node tools/update-data.mjs --report "$RUNNER_TEMP/raport.md"
      - name: Pull request ze zmianami
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automatyczna-aktualizacja-danych
          delete-branch: true
          add-paths: data/*.json
          commit-message: "Aktualizacja danych (endoflife.date, CISA KEV)"
          title: "Aktualizacja danych: daty wsparcia i podatności"
          body-path: ${{ runner.temp }}/raport.md
