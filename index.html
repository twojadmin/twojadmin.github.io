<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aktualny czas</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #1f2937, #111827);
      color: #f9fafb;
      font-family: Arial, sans-serif;
    }

    .clock {
      text-align: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 32px 48px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      font-weight: 500;
    }

    #time {
      margin: 0;
      font-size: 3rem;
      font-weight: bold;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="clock">
    <h1>Aktualny czas</h1>
    <p id="time">00:00:00</p>
  </div>

  <script>
    const timeElement = document.getElementById('time');

    function updateTime() {
      const now = new Date();
      timeElement.textContent = now.toLocaleTimeString('pl-PL', {
        hour12: false
      });
    }

    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
